<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" style="font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A8A8A"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C1654A"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#F5F0EB"/>

  <!-- 头部 -->
  <text x="64" y="50" font-size="15" font-weight="bold" fill="#C1654A" letter-spacing="3">PRODUCT 01 · MEMORY × EVALS</text>
  <text x="64" y="98" font-size="38" font-weight="bold" fill="#2D2D2D">织忆 Memloom</text>
  <text x="64" y="128" font-size="16" fill="#4A4A4A">人和自己 AI 之间的知识治理层——AI 找候选，人判价值</text>
  <rect x="898" y="66" width="318" height="34" rx="17" fill="#E8D5CE"/>
  <text x="1057" y="88" font-size="14" font-weight="bold" fill="#C1654A" text-anchor="middle">2026.03 上海腾讯云峰会 · 主题分享</text>

  <!-- 痛点 -->
  <text x="64" y="162" font-size="15" font-weight="bold" fill="#C1654A">痛点</text>
  <text x="106" y="162" font-size="15" fill="#4A4A4A">｜「存了」不等于「记得」——同一模型，离线读库召回约 92%，放进真实交互场景跌到 58%（LongMemEval）</text>

  <!-- 主流程（左） -->
  <g>
    <rect x="64" y="220" width="150" height="66" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <text x="139" y="248" font-size="16" font-weight="bold" fill="#2D2D2D" text-anchor="middle">日常对话流</text>
    <text x="139" y="270" font-size="12" fill="#8A8A8A" text-anchor="middle">每一次人机会话</text>
    <line x1="214" y1="253" x2="248" y2="253" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="252" y="220" width="150" height="66" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <text x="327" y="248" font-size="16" font-weight="bold" fill="#2D2D2D" text-anchor="middle">AI 蒸馏候选</text>
    <text x="327" y="270" font-size="12" fill="#8A8A8A" text-anchor="middle">五个窄 Agent 只做语义</text>
    <line x1="402" y1="253" x2="436" y2="253" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 人审门（菱形，产品核心） -->
    <polygon points="510,193 584,253 510,313 436,253" fill="#C1654A" filter="url(#sh)"/>
    <text x="510" y="248" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">人审门</text>
    <text x="510" y="270" font-size="12" fill="#FFFFFF" text-anchor="middle">30 秒 / 条</text>
    <line x1="584" y1="253" x2="618" y2="253" stroke="#C1654A" stroke-width="2" marker-end="url(#arrA)"/>

    <rect x="622" y="220" width="158" height="66" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="622" y="220" width="5" height="66" rx="2.5" fill="#C1654A"/>
    <text x="703" y="248" font-size="16" font-weight="bold" fill="#2D2D2D" text-anchor="middle">canonical 编译层</text>
    <text x="703" y="270" font-size="12" fill="#8A8A8A" text-anchor="middle">确认知识 · 条目化</text>

    <!-- 拒绝分支 -->
    <line x1="510" y1="313" x2="510" y2="352" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="510" y="376" font-size="13" fill="#8A8A8A" text-anchor="middle">拒绝 / 沉默——克制是特性</text>
    <text x="510" y="396" font-size="13" fill="#8A8A8A" text-anchor="middle">148 轮对话只留 5 条（3.4%）</text>

    <!-- 双版本输出 -->
    <line x1="668" y1="286" x2="600" y2="438" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="738" y1="286" x2="756" y2="438" stroke="#8A8A8A" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="452" y="444" width="256" height="64" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <text x="580" y="472" font-size="15" font-weight="bold" fill="#2D2D2D" text-anchor="middle">人用版 · 费曼式复习</text>
    <text x="580" y="493" font-size="12" fill="#8A8A8A" text-anchor="middle">机制 · 边界 · 例子</text>
    <rect x="728" y="444" width="256" height="64" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <text x="856" y="472" font-size="15" font-weight="bold" fill="#2D2D2D" text-anchor="middle">Agent 用版 · 上下文注入</text>
    <text x="856" y="493" font-size="12" fill="#8A8A8A" text-anchor="middle">规则 · 约束 · 调用条件</text>
    <path d="M 580 508 L 580 528 L 856 528 L 856 508" fill="none" stroke="#C1654A" stroke-width="2"/>
    <text x="718" y="549" font-size="14" font-weight="bold" fill="#C1654A" text-anchor="middle">同一来源，两版不漂移</text>
  </g>

  <!-- 评测面板（右） -->
  <g>
    <rect x="1010" y="196" width="206" height="360" rx="10" fill="#EDE5DE"/>
    <text x="1030" y="230" font-size="17" font-weight="bold" fill="#C1654A">评测划出产品边界</text>
    <rect x="1030" y="248" width="166" height="88" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <text x="1044" y="274" font-size="13" font-weight="bold" fill="#2D2D2D">Gold set 五维评分</text>
    <text x="1044" y="296" font-size="12" fill="#4A4A4A">证据原句 · 必须覆盖</text>
    <text x="1044" y="315" font-size="12" fill="#4A4A4A">禁止出现的结论</text>
    <rect x="1030" y="352" width="166" height="110" rx="8" fill="#FFFFFF" filter="url(#sh)"/>
    <rect x="1030" y="352" width="5" height="110" rx="2.5" fill="#C1654A"/>
    <text x="1048" y="378" font-size="13" font-weight="bold" fill="#2D2D2D">跨模型验收结论</text>
    <text x="1048" y="402" font-size="12" fill="#4A4A4A">保留人审 → 合格</text>
    <text x="1048" y="424" font-size="12" fill="#4A4A4A">无审自动入库 → 不合格</text>
    <text x="1048" y="447" font-size="11" fill="#8A8A8A">评测直接裁决产品决策</text>
    <text x="1030" y="492" font-size="12" fill="#4A4A4A">盲测对比实验进行中</text>
    <text x="1030" y="511" font-size="11" fill="#8A8A8A">匿名 A/B · 单次正式运行</text>
    <text x="1030" y="530" font-size="11" fill="#8A8A8A">校准 8 例 + 正式 36 例</text>
  </g>

  <!-- 底部数字条 -->
  <line x1="64" y1="592" x2="1216" y2="592" stroke="#D4C5BC" stroke-width="1.5"/>
  <text x="64" y="634" font-size="24" font-weight="bold" fill="#C1654A">三代产品</text>
  <text x="64" y="660" font-size="13" fill="#8A8A8A">插件 → 访谈重构 → 桌面端</text>
  <text x="330" y="634" font-size="24" font-weight="bold" fill="#C1654A">381 项测试</text>
  <text x="330" y="660" font-size="13" fill="#8A8A8A">372 通过 · GitHub 公开发布</text>
  <text x="596" y="634" font-size="24" font-weight="bold" fill="#C1654A">10× token 效率</text>
  <text x="596" y="660" font-size="13" fill="#8A8A8A">索引 · 时间线 · 详情三层检索</text>
  <rect x="936" y="614" width="280" height="36" rx="18" fill="#E8D5CE"/>
  <text x="1076" y="637" font-size="14" font-weight="bold" fill="#C1654A" text-anchor="middle">对应岗位 · Memory × 评估体系</text>
</svg>
